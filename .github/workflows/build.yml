name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows cross-compile (GNU toolchain → Windows PE)
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            artifact_name: ghostrat-v5-windows-x64.exe
            binary_name: ghost.exe
          # Linux native
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ghostrat-v5-linux-x64
            binary_name: ghost
          # macOS Intel
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: ghostrat-v5-macos-x64
            binary_name: ghost
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: ghostrat-v5-macos-arm64
            binary_name: ghost

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            implant/native/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('implant/native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      # ── Linux cross-compile deps ──────────────────────────────────
      - name: Install Linux cross-compile toolchain
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 win32api-utils

      # ── macOS codesigning setup ───────────────────────────────────
      - name: Setup macOS signing certificate
        if: matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_SIGNING_CERT_P12_B64 }}
          p12-password: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}

      # ── Build ─────────────────────────────────────────────────────
      - name: Build release binary
        working-directory: implant/native
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C strip=symbols"

      # ── Package ───────────────────────────────────────────────────
      - name: Package binary
        run: |
          mkdir -p dist
          cp "implant/native/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.artifact_name }}"

      # ── Strip Linux binary ────────────────────────────────────────
      - name: Strip Linux binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          strip "dist/ghostrat-v5-linux-x64" || true
          chmod +x "dist/ghostrat-v5-linux-x64"

      # ── Code-sign macOS binary ────────────────────────────────────
      - name: Code-sign macOS binary
        if: matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin'
        run: |
          codesign --deep --force --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" "dist/${{ matrix.artifact_name }}" 2>/dev/null || true
          dsymutil "dist/${{ matrix.artifact_name }}" 2>/dev/null || true

      # ── Upload artifact ───────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 30
          if-no-files-found: error

  # ── Aggregate: create GitHub Release on tag push ────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "GhostRAT v5 ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            artifacts/ghostrat-v5-windows-x64.exe
            artifacts/ghostrat-v5-linux-x64
            artifacts/ghostrat-v5-macos-x64
            artifacts/ghostrat-v5-macos-arm64
          draft: false
          prerelease: ${{ !github.ref_type == 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
